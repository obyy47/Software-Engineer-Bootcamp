<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Katalog Skincare - Sesi 5</title>

    <!-- Bootstrap 5 CSS CDN (Grid & Layout Utility) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Main Wrapper untuk Area Utama Aplikasi -->
    <main class="min-vh-100 d-flex align-items-center justify-content-center">
      <div class="container py-5">
        <!-- Header Katalog -->
        <header class="text-center mb-4">
          <h1 class="judul-katalog">KATALOG SKINCARE</h1>
        </header>

        <!-- Area Tombol Filter Kategori -->
        <nav
          class="filter-wrapper d-flex flex-wrap justify-content-center gap-2 mb-4"
          aria-label="Filter Kategori Skincare"
        >
          <button type="button" class="btn-filter" data-kategori="semua">
            Semua
          </button>
          <button type="button" class="btn-filter" data-kategori="moisturizer">
            Moisturizer
          </button>
          <button type="button" class="btn-filter" data-kategori="sunscreen">
            Sunscreen
          </button>
          <button type="button" class="btn-filter" data-kategori="serum">
            Serum
          </button>
          <button type="button" class="btn-filter" data-kategori="toner">
            Toner
          </button>
          <button type="button" class="btn-filter" data-kategori="facewash">
            Facewash
          </button>
        </nav>

        <!-- Container Grid Produk (Di-render oleh JavaScript) -->
        <div id="produk-container" class="produk-grid"></div>
      </div>
    </main>

    <!-- App Execution Script -->
    <script src="app.js"></script>
  </body>
</html>
